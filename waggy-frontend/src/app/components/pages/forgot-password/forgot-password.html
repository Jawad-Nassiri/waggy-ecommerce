<!-- banner component  -->
<app-banner title="Forgot-password"></app-banner>

<div class="forgot-container">
  <h1>Forgot password?</h1>
  <p>Enter your email and we will send you a link to reset your password.</p>

  <form class="auth-form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <input type="email" name="email" placeholder="Email" [(ngModel)]="email" required />
    </div>

    <div class="back-login">
      <a routerLink="/login">Back to login</a>
    </div>

    <button type="submit" class="btn-submit" [disabled]="isSubmitted()">SEND LINK</button>
  </form>
</div>

<!-- toast component  -->
@if (showToast()) {
  <app-toast
    [title]="toastTitle"
    [message]="toastMessage"
    [type]="toastType"
    (closed)="showToast.set(false)"
  >
  </app-toast>
}

<!-- gallery component  -->
<app-gallery [images]="galleryImages"></app-gallery>
