<!-- banner component  -->
<app-banner title="Single Product"></app-banner>

<!-- product detail  -->
@if (product(); as product) {
  <main class="product">
    <div class="product-photo">
      <img [src]="'/images/products/' + product?.image">
    </div>

    <section class="product-info">
      <h1>{{ product.name }}</h1>

      <p class="price">${{ product.price }}</p>

      <p class="description">
        {{ product.description }}
      </p>

      <p class="stock">{{ product.stock }} in stock</p>

      <div class="qty">
        <button type="button" (click)="decreaseQuantity()">&minus;</button>

        <input
          type="number"
          [value]="productQty"
          readonly
        />

        <button type="button" (click)="increaseQuantity()">+</button>
      </div>

      <button type="button" class="btn-basket">Add to basket</button>

      <a routerLink="/products" class="btn btn-dark">
        continue shopping
      </a>
    </section>
  </main>
}


<!-- gallery component -->
<app-gallery [images]="galleryImages" alt="Animal Photo"></app-gallery>
