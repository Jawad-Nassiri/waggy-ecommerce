<!-- banner component  -->
<app-banner title="FAQs"></app-banner>

<main class="faq-main">
  <h1>Frequently Asked Questions</h1>

  <p class="faq-intro">
    Find answers to the most common questions about shopping with Waggy, managing your account,
    placing orders, and making payments.
  </p>

  <div class="faq-list">
    @for (faq of faqs; track $index) {
      <div class="faq-item" [class.open]="openIndex() === $index">
        <button
          class="faq-question"
          type="button"
          [attr.aria-expanded]="openIndex() === $index"
          (click)="toggle($index)">
          <span>{{ faq.q }}</span>
          <span class="faq-icon"><i class="fa-solid fa-caret-down"></i></span>
        </button>

        <div class="faq-answer">
          <div class="faq-answer-inner">{{ faq.a }}</div>
        </div>
      </div>
    }
  </div>
</main>

<!-- gallery component  -->
<app-gallery [images]="galleryImages"></app-gallery>
