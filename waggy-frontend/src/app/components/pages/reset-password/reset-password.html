<!-- banner component  -->
<app-banner title="Reset-password"></app-banner>

<div class="forgot-container">
  <h1>Forgot password?</h1>
  <p>Enter your password and we will update your password.</p>

  <form class="auth-form" (ngSubmit)="resetPassword()">
    <div class="form-group">
      <input
        type="password"
        name="password"
        placeholder="Password"
        #passwordInput
        required
        (input)="validatePassword(passwordInput.value, passwordInput)"
        [(ngModel)]="password"
      />
      <i
        class="fa-solid fa-eye-slash eye-icon"
        (click)="changeEyeIconStatus($event, passwordInput)"
      ></i>
      @if (passwordInput.value !== '' && !passwordValid) {
        <small>Password is not valid</small>
      }
    </div>

    <div class="back-login">
      <a routerLink="/forgot-password">Back to forgot password</a>
    </div>

    <button type="submit" class="btn-submit">SEND</button>
  </form>
</div>

<!-- toast component  -->
@if (showToast()) {
  <app-toast
    [title]="toastTitle"
    [message]="toastMessage"
    [type]="toastType"
    (closed)="showToast.set(false)"
  >
  </app-toast>
}

<!-- gallery component  -->
<app-gallery [images]="galleryImages"></app-gallery>
