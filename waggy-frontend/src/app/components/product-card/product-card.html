<a [routerLink]="['/product-detail', product.id]" class="product-card-link">
  <div class="product-card">
    <div class="product-image">
      <img [src]="getImageUrl(product.image)" [alt]="product.name" />
    </div>

    <h3>{{ product.name }}</h3>

    <div class="product-stars">
      <span>★★★ 3.0</span>
    </div>

    <p class="product-price">${{ product.price | number: '1.2-2' }}</p>

    @if (product.stock > 0) {
      <button
        class="btn-cart"
        [disabled]="isStockLimitReached(product)"
        (click)="addToCart($event)"
      >
        @if (isStockLimitReached(product)) {
          OUT OF STOCK
        } @else {
          ADD TO CART
        }
      </button>
    } @else {
      <button class="btn-cart" disabled>OUT OF STOCK</button>
    }
  </div>
</a>

<!-- toast component  -->
@if (showToast()) {
  <app-toast
    [title]="toastTitle"
    [message]="toastMessage"
    [type]="toastType"
    (closed)="showToast.set(false)"
  ></app-toast>
}
